# Install as /etc/systemd/system/arcway.service.d/wireguard-probe-relay.conf.
[Unit]
Wants=arcway-wireguard-probe-egress.service
After=arcway-wireguard-probe-egress.service

[Service]
Environment="ARCWAY_MIHOMO_WIREGUARD_EGRESS_PORT=443"
ExecStartPre=/opt/arcway/bin/arcway-wireguard-probe-egress status
