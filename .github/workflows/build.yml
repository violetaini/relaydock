name: Backend CI and Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Build and publish a tagged Docker image and GitHub Release
        required: true
        default: false
        type: boolean
      release_scope:
        description: full, or frontend-only when the control-plane version and API stay unchanged
        required: true
        default: full
        type: choice
        options:
          - full
          - frontend-only

permissions:
  contents: read

env:
  AGENT_SOURCE_SHA: 52d5601484149c4cb80fb80aff248c96bd8e63f8

jobs:
  verify:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Verify embedded frontend snapshot
        run: |
          test -s internal/web/dist/index.html
          test -n "$(find internal/web/dist/assets -type f -print -quit)"

      - name: Verify release contract tooling
        run: |
          bash -n \
            scripts/write-release-web-metadata.sh \
            scripts/build-release-web-bundle.sh \
            scripts/write-release-manifest.sh \
            scripts/verify-release-bundle.sh \
            scripts/release-bundle-contract_test.sh \
            scripts/deploy-frontend.sh \
            scripts/deploy-frontend_test.sh
          scripts/release-bundle-contract_test.sh
          bash scripts/deploy-frontend_test.sh

      - name: Validate release Dockerfile
        run: docker buildx build --check --file Dockerfile.release .

      - name: Verify modules
        run: go mod verify

      - name: Run tests
        run: go test ./...

      - name: Verify WireGuard relay firewall assets
        run: |
          bash -n deploy/arcway-wireguard-probe-egress.sh scripts/wireguard_probe_egress_test.sh
          sudo bash scripts/wireguard_probe_egress_test.sh

      - name: Build server
        run: go build -trimpath -o /tmp/arcway ./cmd/server

  build:
    name: Build ${{ matrix.output }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: arcway-linux-amd64
          - goos: linux
            goarch: arm64
            output: arcway-linux-arm64
          - goos: darwin
            goarch: amd64
            output: arcway-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: arcway-darwin-arm64
          - goos: windows
            goarch: amd64
            output: arcway-windows-amd64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o build/${{ matrix.output }} ./cmd/server

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: build/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 7

  guard:
    name: Build expiry guard (${{ matrix.goarch }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o build/arcway-expiry-guard-linux-${{ matrix.goarch }} ./cmd/arcway-expiry-guard

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: arcway-expiry-guard-linux-${{ matrix.goarch }}
          path: build/arcway-expiry-guard-linux-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 7

  speedtester:
    name: Build speedtester (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: relaydock-speedtester-linux-amd64
          - goos: linux
            goarch: arm64
            output: relaydock-speedtester-linux-arm64
          - goos: windows
            goarch: amd64
            output: relaydock-speedtester-windows-amd64.exe
          - goos: windows
            goarch: arm64
            output: relaydock-speedtester-windows-arm64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o build/${{ matrix.output }} ./cmd/relaydock-speedtester

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: build/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 7

  agent:
    name: Build Agent (${{ matrix.goarch }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout pinned Agent source
        uses: actions/checkout@v4
        with:
          repository: violetaini/relaydock-agent
          ref: ${{ env.AGENT_SOURCE_SHA }}
          path: agent-src

      - name: Verify pinned sources
        run: test "$(git -C agent-src rev-parse HEAD)" = "$AGENT_SOURCE_SHA"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: agent-src/go.sum

      - name: Verify Agent modules and record official Xray version
        working-directory: agent-src
        run: |
          go mod verify
          go list -m -f 'Official Xray module: {{.Path}} {{.Version}}' github.com/xtls/xray-core

      - name: Build Agent
        working-directory: agent-src
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o build/relaydock-agent-linux-${{ matrix.goarch }} ./cmd/relaydock-agent

      - name: Upload Agent binary
        uses: actions/upload-artifact@v4
        with:
          name: relaydock-agent-linux-${{ matrix.goarch }}
          path: agent-src/build/relaydock-agent-linux-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 7

  package:
    name: Assemble verified release bundle
    needs: [build, guard, agent, speedtester]
    if: ${{ inputs.publish && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    env:
      RELAYDOCK_RELEASE_SCOPE: ${{ inputs.release_scope }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: Download current-run binaries
        uses: actions/download-artifact@v4
        with:
          path: release-bundle
          merge-multiple: true

      - name: Read release metadata
        run: |
          release_version="$(sed -nE 's/^[[:space:]]*const[[:space:]]+Version[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)"[[:space:]]*$/\1/p' internal/version/version.go)"
          api_contract="$(sed -nE 's/^[[:space:]]*const[[:space:]]+APIContract[[:space:]]*=[[:space:]]*([1-9][0-9]*)[[:space:]]*$/\1/p' internal/version/version.go)"
          test "$(printf '%s\n' "$release_version" | grep -c .)" = 1
          test "$(printf '%s\n' "$api_contract" | grep -c .)" = 1
          case "$RELAYDOCK_RELEASE_SCOPE" in
            full)
              test "v$release_version" = "$GITHUB_REF_NAME"
              ;;
            frontend-only)
              test "v$release_version" != "$GITHUB_REF_NAME"
              ;;
            *)
              echo "unsupported release scope: $RELAYDOCK_RELEASE_SCOPE" >&2
              exit 1
              ;;
          esac
          echo "RELAYDOCK_CONTROL_PLANE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "RELEASE_API_CONTRACT=$api_contract" >> "$GITHUB_ENV"

      - name: Build deterministic frontend release asset
        run: |
          scripts/build-release-web-bundle.sh \
            internal/web/dist \
            release-bundle/relaydock-web.tar.gz \
            "$GITHUB_REF_NAME" \
            "$GITHUB_SHA" \
            "$RELEASE_API_CONTRACT"

      - name: Verify provenance and prepare checksums
        run: |
          scripts/verify-release-bundle.sh \
            release-bundle \
            "$GITHUB_SHA" \
            "$AGENT_SOURCE_SHA" \
            --release-tag "$GITHUB_REF_NAME" \
            --api-contract "$RELEASE_API_CONTRACT" \
            --write-manifest \
            --write-checksums

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ github.sha }}
          path: release-bundle/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  docker:
    name: Build and Push Docker Image
    needs: package
    if: ${{ inputs.publish && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle-${{ github.sha }}
          path: docker-release

      - name: Verify release bundle checksums
        run: |
          cd docker-release
          sha256sum -c checksums.txt

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/violetaini/relaydock
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish GitHub Release
    needs: docker
    if: ${{ inputs.publish && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle-${{ github.sha }}
          path: release

      - name: Verify release bundle checksums
        run: |
          cd release
          sha256sum -c checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/arcway-*
            release/relaydock-agent-linux-*
            release/relaydock-speedtester-*
            release/relaydock-web.tar.gz
            release/relaydock-release-manifest.json
            release/checksums.txt
